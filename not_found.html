<!DOCTYPE html>
<html lang="zh-TW">
<head>

  <title>404 | 找不到頁面</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      color: var(--nf-text);
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background-image:
        linear-gradient(150deg, rgba(15, 23, 42, 0.45), rgba(30, 41, 59, 0.3)),

      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

<body>
  <main class="nf-card">
    <p class="nf-code">404</p>
    <h1 class="nf-title">找不到這個頁面</h1>

    <div class="nf-actions">
      <a class="nf-btn" href="./">回到首頁</a>
      <a class="nf-btn ghost" href="javascript:history.back()">返回上一頁</a>
