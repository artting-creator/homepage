 <!DOCTYPE html>
 <html lang="zh-TW">
 <head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Artting 的小工具站</title>
   <link rel="stylesheet" href="./style.css">
 </head>
 <body>
   <!-- Signboard -->
   <div class="signboard">
     <div class="signboard-chain"></div>
     <div class="signboard-ring"></div>
     <div class="signboard-body">
       <h1>Artting 小工具站</h1>
     </div>
    </div>
 
   <!-- Other Files Button -->
   <div class="folder-btn" id="folderBtn">
     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
       <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
     </svg>
     <span data-i18n="other-files">其它檔案</span>
   </div>
 
   <!-- File Panel -->
   <div class="file-panel" id="filePanel">
     <div class="file-panel-header">
       <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
         <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
       </svg>
       <span data-i18n="other-files">其它檔案</span>
       <button class="file-panel-close" id="filePanelClose">&times;</button>
     </div>
     <div class="file-panel-body">
       <div class="file-list" id="fileList"></div>
       <div class="file-desc-area" id="fileDescArea">
         <div class="file-desc-placeholder" data-i18n="select-file">請點選檔案查看說明</div>
         <div class="file-desc-content" id="fileDescContent"></div>
       </div>
     </div>
   </div>
   <div class="top-bar">
     <div class="custom-select" id="langSelectWrapper">
       <button class="select-button" id="langButton">
         <span id="langText">中文</span>
         <span class="arrow">&#9660;</span>
       </button>
       <div class="select-options" id="langOptions">
         <div class="option selected" data-value="zh-TW">繁體介面</div>
         <div class="option" data-value="zh-CN">简体介面</div>
         <div class="option" data-value="en">English UI</div>
       </div>
     </div>
    <button id="themeToggle" class="theme-btn">☀️ 淺色</button>
   </div>
 
  <!-- Converter (left) -->
  <div class="converter-side">
    <a href="./tools/GBK_BIG5_UI.html" target="_blank" rel="opener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
      <span data-i18n="converter">繁簡轉換器</span>
    </a>
  </div>
 
  <!-- Center action buttons -->
  <div class="btn-group">

      <a class="tool-btn forum-accent" href="./MessageBoard/mainBoard.html" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span class="btn-label" data-i18n="board">留言板</span>
     </a>

      <a class="tool-btn test-accent" href="./not_found.html" target="_blank" rel="opener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <span class="btn-label" data-i18n="test-area">測試區</span>
     </a>
  </div>
 <script>
   (function(){
     const i18n={
       "zh-TW":{
         "converter":"繁簡轉換器",
        "board":"留言板",
        "test-area":"測試區",
        "t-light":"☀️ 淺色",
         "t-trans":"☀️ 透明",
         "t-dark":"🌙 深色",
         "t-dark-trans":"🌙 透明",
         "lang":"中文"
       },
       "zh-CN":{
         "converter":"繁简转换器",
        "board":"留言板",
        "test-area":"测试区",
        "t-light":"☀️ 浅色",
         "t-trans":"☀️ 透明",
         "t-dark":"🌙 深色",
         "t-dark-trans":"🌙 透明",
         "lang":"简体中文"
       },
       "en":{
         "converter":"Converter",
        "board":"Message Board",
        "test-area":"Test Area",
        "t-light":"☀️ Light",
         "t-trans":"☀️ Transparent",
         "t-dark":"🌙 Dark",
         "t-dark-trans":"🌙 Transparent",
         "lang":"English"
       }
     };
     let curLang=localStorage.getItem("lang")||"zh-TW";
     if(!i18n[curLang])curLang="zh-TW";
     const themeBtn=document.getElementById("themeToggle");
     const langSelectWrapper=document.getElementById("langSelectWrapper");
     const langButton=document.getElementById("langButton");
     const langText=document.getElementById("langText");
     const langOptions=document.getElementById("langOptions");
     function setTheme(mode){
       if(!i18n[curLang])curLang="zh-TW";
       document.body.classList.remove("dark","transparent");
       if(mode==="light-transparent"){document.body.classList.add("transparent")}
       else if(mode==="dark"){document.body.classList.add("dark")}
       else if(mode==="dark-transparent"){document.body.classList.add("dark","transparent")}
       localStorage.setItem("theme",mode);
       const labels={"light":i18n[curLang]["t-light"],"light-transparent":i18n[curLang]["t-trans"],"dark":i18n[curLang]["t-dark"],"dark-transparent":i18n[curLang]["t-dark-trans"]};
       themeBtn.textContent=labels[mode]||i18n[curLang]["t-light"];
     }
     function applyLang(lang){
       curLang=lang;
       localStorage.setItem("lang",lang);
       Array.from(document.querySelectorAll("[data-i18n]")).forEach(function(el){
         const key=el.dataset.i18n;
         if(i18n[lang][key])el.textContent=i18n[lang][key];
       });
       langText.textContent=i18n[lang]["lang"];
       Array.from(langOptions.querySelectorAll(".option")).forEach(function(o){
         o.classList.toggle("selected",o.dataset.value===lang);
       });
       setTheme(localStorage.getItem("theme")||"light");
     }
     setTheme(localStorage.getItem("theme")||"light");
     applyLang(curLang);
     themeBtn.addEventListener("click",function(){
       const isDark=document.body.classList.contains("dark");
       const isTransparent=document.body.classList.contains("transparent");
       if(!isDark&&!isTransparent)setTheme("light-transparent");
       else if(!isDark&&isTransparent)setTheme("dark");
       else if(isDark&&!isTransparent)setTheme("dark-transparent");
       else setTheme("light");
     });
     langButton.addEventListener("click",function(e){
       e.stopPropagation();
       langSelectWrapper.classList.toggle("open");
     });
     Array.from(langOptions.querySelectorAll(".option")).forEach(function(opt){
       opt.addEventListener("click",function(){
         langSelectWrapper.classList.remove("open");
         applyLang(this.dataset.value);
       });
     });
     document.addEventListener("click",function(){
       langSelectWrapper.classList.remove("open");
      });
    // ===== File Explorer =====
    const filesData = [
      { name: "autollama.bat", desc: "llama.cpp 啟動器腳本，支援多模型選擇、API 金鑰配置與 Jinja 模板，可一鍵啟動 LLM 推論伺服器。", path: "./files/autollama.bat" },
      { name: "start-chrome-debug-9222.bat", desc: "以遠端除錯模式啟動 Chrome 瀏覽器，連接埠 9222，供自動化工具或爬蟲程式連接操控。", path: "./files/start-chrome-debug-9222.bat" },
      { name: "Start-SillyTavern.bat", desc: "SillyTavern 酒館的前端啟動腳本，在酒館安裝目錄下執行。簡易防呆，不更新版本，有缺node_modules目錄才用最精簡的參數安裝依賴，接著以正式產品模式執行（效能最佳化）。", path: "./files/Start-SillyTavern.bat" },
      { name: "UpdateComfyUI.bat", desc: "ComfyUI 一鍵更新工具，自動拉取最新版本並更新依賴套件，保持繪圖工作流程順暢。", path: "./files/UpdateComfyUI.bat" },
      { name: "酒館助手參考文件-types-手機或AI官網用.txt", desc: "SillyTavern 酒館助手 TypeScript 型別定義參考文件，包含 Audio、Chat、Plugin 等完整型別，可於手機端或 AI 官網查閱。", path: "./files/酒館助手參考文件-types-手機或AI官網用.txt" }
    ];
    i18n["zh-TW"]["other-files"]="其它檔案";i18n["zh-TW"]["select-file"]="請點選檔案查看說明";
    i18n["zh-CN"]["other-files"]="其它文件";i18n["zh-CN"]["select-file"]="请点击文件查看说明";
    i18n["en"]["other-files"]="Other Files";i18n["en"]["select-file"]="Click a file to see description";
    Array.from(document.querySelectorAll("[data-i18n]")).forEach(function(el){
      const key=el.dataset.i18n;
      if(i18n[curLang][key])el.textContent=i18n[curLang][key];
    });
    (function(){
      const folderBtn=document.getElementById("folderBtn");
      const filePanel=document.getElementById("filePanel");
      const closeBtn=document.getElementById("filePanelClose");
      const fileListEl=document.getElementById("fileList");
      const descContent=document.getElementById("fileDescContent");
      const descArea=document.getElementById("fileDescArea");
      folderBtn.addEventListener("click",function(e){e.stopPropagation();filePanel.classList.toggle("open");});
      closeBtn.addEventListener("click",function(){filePanel.classList.remove("open");});
      filesData.forEach(function(file){
        const item=document.createElement("div");item.className="file-item";
        const nameSpan=document.createElement("span");nameSpan.className="file-name";
        nameSpan.textContent=file.name;
        nameSpan.addEventListener("click",function(){
          descContent.textContent=file.desc;descArea.classList.add("has-content");
          document.querySelectorAll(".file-item").forEach(function(el){el.classList.remove("selected");});
          item.classList.add("selected");
        });
        const dlBtn=document.createElement("a");dlBtn.className="file-download";
        dlBtn.href=file.path;dlBtn.download=file.name;
        dlBtn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
        item.appendChild(nameSpan);item.appendChild(dlBtn);fileListEl.appendChild(item);
      });
      document.addEventListener("click",function(e){
        if(filePanel.classList.contains("open")&&!filePanel.contains(e.target)&&!folderBtn.contains(e.target))filePanel.classList.remove("open");
      });
    })();
   })();
 </script>
  </body>
 </html>
