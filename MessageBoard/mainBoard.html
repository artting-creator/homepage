<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端留言板 - 測試</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
        }
        
        .input-section {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .messages-section {
            padding: 30px;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .message {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            transition: box-shadow 0.3s;
        }
        
        .message:hover {
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .username {
            font-weight: bold;
            color: #667eea;
            font-size: 16px;
        }
        
        .time {
            font-size: 12px;
            color: #adb5bd;
        }
        
        .message-content {
            color: #495057;
            line-height: 1.5;
            word-wrap: break-word;
        }
        
        .empty-state {
            text-align: center;
            color: #adb5bd;
            padding: 40px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #adb5bd;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        .status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        
        .status.error {
            background: #dc3545;
        }
        
        .status.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 雲端留言板 - 測試版</h1>
            <p>留下你想說的話，和大家分享你的想法</p>
        </div>
        
        <div class="input-section">
            <div class="form-group">
                <label>👤 你的名字</label>
                <input type="text" id="username" placeholder="請輸入你的名字" maxlength="50">
            </div>
            <div class="form-group">
                <label>💭 留言內容</label>
                <textarea id="content" rows="4" placeholder="寫下你想說的話..." maxlength="500"></textarea>
            </div>
            <button id="submitBtn">📤 發送留言</button>
        </div>
        
        <div class="messages-section">
            <h3 style="margin-bottom: 20px;">📝 最新留言</h3>
            <div id="messages">
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 10px;">載入留言中...</p>
                </div>
            </div>
        </div>
    </div>
    
    <div id="status" class="status">✅ 操作成功</div>

    <!-- 引入 Supabase SDK - 使用正確的方式 -->
    <script type="module">
        // ⚠️ 請在這裡貼上你的 Supabase URL 和 anon key
        const SUPABASE_URL = 'https://ivhipzricpbiufcbquvc.supabase.co';  // 例如: https://xxxxx.supabase.co
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2aGlwenJpY3BiaXVmY2JxdXZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NTgwNzAsImV4cCI6MjA5NjEzNDA3MH0.ApNWoASUkODft8UpetMCALx9baRRfT0-oSce1DVbdd0';  // 例如: eyJhbGciOiJIUzI1NiIs...
        
        // 動態載入 Supabase SDK
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        
        // 初始化 Supabase 客戶端
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // 顯示狀態訊息
        function showStatus(message, isError = false) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = isError ? `❌ ${message}` : `✅ ${message}`;
            statusDiv.className = isError ? 'status error show' : 'status show';
            setTimeout(() => {
                statusDiv.classList.remove('show');
            }, 15000);
        }
        
        // 載入留言
        async function loadMessages() {
            try {
                const { data, error } = await supabase
                    .from('messages')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (error) {
                    console.error('載入失敗:', error);
                    showStatus('載入留言失敗', true);
                    return;
                }
                
                displayMessages(data);
            } catch (error) {
                console.error('發生錯誤:', error);
                showStatus('連線失敗，請檢查網路', true);
            }
        }
        
        // 顯示留言
        function displayMessages(messages) {
            const messagesDiv = document.getElementById('messages');
            
            if (!messages || messages.length === 0) {
                messagesDiv.innerHTML = '<div class="empty-state">✨ 還沒有留言，搶個頭香吧！</div>';
                return;
            }
            
            messagesDiv.innerHTML = messages.map(msg => `
                <div class="message">
                    <div class="message-header">
                        <span class="username">${escapeHtml(msg.username)}</span>
                        <span class="time">${formatDate(msg.created_at)}</span>
                    </div>
                    <div class="message-content">${escapeHtml(msg.content)}</div>
                </div>
            `).join('');
        }
        
        // 發送留言
        async function postMessage() {
            const username = document.getElementById('username').value.trim();
            const content = document.getElementById('content').value.trim();
            
            // 驗證輸入
            if (!username) {
                showStatus('請填寫你的名字！', true);
                return;
            }
            
            if (!content) {
                showStatus('請填寫留言內容！', true);
                return;
            }
            
            if (username.length > 50) {
                showStatus('名字不能超過 50 個字！', true);
                return;
            }
            
            if (content.length > 500) {
                showStatus('留言內容不能超過 500 個字！', true);
                return;
            }
            
            // 顯示傳送中狀態
            const button = document.getElementById('submitBtn');
            const originalText = button.textContent;
            button.textContent = '📤 發送中...';
            button.disabled = true;
            
            try {
                const { data, error } = await supabase
                    .from('messages')
                    .insert([{ 
                        username: username, 
                        content: content 
                    }]);
                
                if (error) {
                    console.error('發送失敗:', error);
                    showStatus('發送失敗: ' + error.message, true);
                    return;
                }
                
                // 清空輸入框
                document.getElementById('username').value = '';
                document.getElementById('content').value = '';
                
                showStatus('留言發送成功！');
                
                // 重新載入留言
                await loadMessages();
                
                // 滾動到最新留言
                const messagesDiv = document.getElementById('messages');
                messagesDiv.scrollTop = 0;
                
            } catch (error) {
                console.error('發生錯誤:', error);
                showStatus('發送失敗，請稍後再試', true);
            } finally {
                button.textContent = originalText;
                button.disabled = false;
            }
        }
        
        // 防止 XSS 攻擊
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        
        // 格式化日期
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            
            // 少於 1 分鐘
            if (diff < 60000) {
                return '剛剛';
            }
            // 少於 1 小時
            if (diff < 3600000) {
                return `${Math.floor(diff / 60000)} 分鐘前`;
            }
            // 少於 24 小時
            if (diff < 86400000) {
                return `${Math.floor(diff / 3600000)} 小時前`;
            }
            // 顯示完整日期
            return date.toLocaleString('zh-TW', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        
        // 綁定發送按鈕事件
        document.getElementById('submitBtn').addEventListener('click', postMessage);
        
        // 支援 Enter 快速發送（Ctrl+Enter）
        document.getElementById('content').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                postMessage();
            }
        });
        
        // 頁面載入時載入留言
        loadMessages();
        
        // 每 60 秒自動刷新留言
        setInterval(loadMessages, 60000);
        
        console.log('✅ 留言板初始化成功，Supabase 已連接');
    </script>
</body>
</html>
